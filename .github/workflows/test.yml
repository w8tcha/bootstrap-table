name: Test

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      site: ${{ steps.filter.outputs.site }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            site:
              - 'site/**'
              - 'yarn.lock'

  test:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: latest
          cache: 'yarn'

      - name: Lint src and check docs
        run: |
          yarn install --frozen-lockfile
          yarn pre-commit

      - name: Lint and build site
        if: needs.changes.outputs.site == 'true'
        run: |
          cd site
          yarn install --frozen-lockfile
          yarn lint
          yarn build

      - name: Cypress Test
        run: |
          yarn build
          yarn test
