<script>
  init({
    title: 'Export Events',
    desc: 'Test export-started and export-saved events.',
    links: [
      'bootstrap-table.min.css'
    ],
    scripts: [
      'https://cdn.jsdelivr.net/npm/tableexport.jquery.plugin@1.29.0/tableExport.min.js',
      'bootstrap-table.min.js',
      'extensions/export/bootstrap-table-export.min.js'
    ]
  })
</script>

<template>
  <table id="table">
    <thead>
      <tr>
        <th data-field="id">ID</th>
        <th data-field="name">Name</th>
        <th data-field="price">Price</th>
      </tr>
    </thead>
  </table>
</template>

<script>
  function mounted () {
    const table = document.getElementById('table')

    BootstrapTable.init(table, {
      showExport: true,
      data: [
        { id: 1, name: 'Item 1', price: '$1' },
        { id: 2, name: 'Item 2', price: '$2' }
      ]
    })

    table.addEventListener('export-started.bs.table', () => {
      window._exportStarted = true
    })
    table.addEventListener('export-saved.bs.table', e => {
      window._exportSaved = true
      window._exportedData = e.detail[0]
    })
  }
</script>
